[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studiestap"
version = "0.1.0"
description = "StudieStap 2.0 - schone, modulaire audiopipeline voor workshopreflectie"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Zware modelpakketten: apart, zodat de kern en de tests licht blijven.
models = [
    "faster-whisper==1.2.1",
    "av==18.1.0",
    "pyannote.audio==4.0.7",
]
align = [
    "whisperx",
]
dev = ["pytest>=8"]

[project.scripts]
studiestap = "studiestap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "needs_ffmpeg: test heeft ffmpeg op PATH nodig",
]
